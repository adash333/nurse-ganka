# GitHub Pages（Deploy from a branch, root）用の設定。
title: 看護師・准看護師試験 眼科過去問と解説
description: 看護師国家試験・准看護師試験の眼科に関連する過去問を、問題文・選択肢別解説・公式正答・出典の順に整理した学習用教材。緑内障、白内障、網膜剝離、散瞳薬と眼底検査、点眼、対光反射などの頻出主題を参考書にまとめています。
lang: ja
url: https://adash333.github.io
baseurl: /nurse-ganka
theme: jekyll-theme-primer
